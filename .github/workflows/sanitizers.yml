name: Clang Sanitizers

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test-clang:
    runs-on: ubuntu-latest

    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Install Tools
      run: |
        sudo apt update
        sudo apt install -y ninja-build cmake
        sudo apt install -y wget gnupg lsb-release software-properties-common

    - name: Add LLVM apt repository (for Clang 20)
      run: |
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 20
        sudo apt install -y libc++-20-dev libc++abi-20-dev

    - name: Set Clang 20 as default
      run: |
        sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-20 100
        sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-20 100
        clang --version
        clang++ --version

    - name: Install vcpkg
      run: |
        git clone https://github.com/microsoft/vcpkg.git $VCPKG_ROOT
        $VCPKG_ROOT/bootstrap-vcpkg.sh

    - name: Configure with CMake Preset
      run: cmake --preset x64-linux-clang-sanitizers

    - name: Build application
      run: cmake --build --preset x64-linux-clang-sanitizers --config Debug --target whisp_tests

    - name: Run unit tests
      run: ctest --preset x64-linux-clang-sanitizers --build-config Debug
