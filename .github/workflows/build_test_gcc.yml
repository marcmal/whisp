name: Build & Test (GCC)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test-gcc:
    runs-on: ubuntu-latest
    container: archlinux:latest

    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Update and Install Tools
      run: |
        # Arch containers need a keyring refresh occasionally 
        # to verify new packages.
        pacman -Syu --noconfirm
        pacman -S --noconfirm base-devel gcc cmake ninja git curl zip unzip tar

    - name: Verify GCC Version
      run: g++ --version

    - name: Install vcpkg
      run: |
        git clone https://github.com/microsoft/vcpkg.git $VCPKG_ROOT
        $VCPKG_ROOT/bootstrap-vcpkg.sh

    - name: Configure with CMake Preset
      run: cmake --preset x64-linux-gcc-dynamic

    - name: Build unit tests
      run: cmake --build --preset x64-linux-gcc-dynamic --config Release --target tests

    - name: Run unit tests
      run: ctest --preset x64-linux-gcc-dynamic --build-config Release
