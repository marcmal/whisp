name: Clang Static Analysis

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test-clang:
    runs-on: ubuntu-latest

    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Install Ninja
      run: sudo apt-get update && sudo apt-get install -y ninja-build

    - name: Install Clang
      run: |
        sudo apt update
        sudo apt install -y clang libc++abi-dev libc++-dev

    - name: Install vcpkg
      run: |
        git clone https://github.com/microsoft/vcpkg.git $VCPKG_ROOT
        $VCPKG_ROOT/bootstrap-vcpkg.sh

    - name: Verify Clang Version
      run: clang++ --version

    - name: Configure with CMake Preset
      run: cmake --preset x64-linux-clang-tidy

    - name: Build application
      run: cmake --build --preset x64-linux-clang-tidy --config Release --target whisp
